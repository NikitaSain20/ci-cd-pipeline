name: ci-cd pipeline
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: '20'
            - run: npm ci
            - run: npm build
            - run: npm test
    cd:
        needs: ci
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/railway-github-action@v1
              with:
                railwayToken: ${{ secrets.RAILWAY_TOKEN }}
              